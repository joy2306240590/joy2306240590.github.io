      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"

</header>

  <main class="right-content">
    <h1 class="h1">CONTACT of KICHIJYOJI</h1>

    <div class="contact-container">
      <h2 class="info-h2">お問い合わせ</h2>

      <form action="サーバーのパス" method="post">
        <div class="form-wrapper">
          <label for="name" class="form-label">お名前</label>

        <div class="form-wrapper">

          <input type="text" name="E-Mail" id="e-mail" class="data-input">
        </div>

        <div class="form-wrapper">
          <label for="comment" class="form-label">お問い合わせ内容</label>
          <textarea name="ご要望・ご質問など" id="comment" cols="50" rows="8" maxlength="30" class="data-input"></textarea>
        </div>

        <div class="submit-btn-wrapper">
          <input type="submit" value="入力内容を確認する" class="submit-btn">
        </div>
     </form>

  <a class="menu-hamburger">

    <span class="menu__line menu__line--center"></span>

  </nav>

<script src="https://code.jquery.com/jquery-latest.min.js"></script>
<script>
jQuery(function($){
  const $btn   = $('.menu-hamburger');      
  const $menu  = $('.left-content');

  function openMenu(){
    $menu.addClass('open'); 
    $btn.addClass('active'); // 汉堡变X
  }

  function closeMenu(){
    $menu.removeClass('open'); 
    $btn.removeClass('active'); // X变回汉堡
  }

  // 1. 点击汉堡按钮：切换菜单状态
  $btn.on('click', function(){
    if ($menu.hasClass('open')) {
      closeMenu();
    } else {
      openMenu();
    }
  });

  // 2. 核心精简逻辑：点击菜单区域收回
  $menu.on('click', function(e){
    // 只在屏幕宽度小于 1024px（手机/平板）时生效
    if (window.innerWidth < 1024) {
      
      // $(e.target) 是你手指实际点到的元素
      // .is('.left-content') 判断是不是点到了最底下的空白背景
      // .is('a') 判断是不是点到了菜单里的链接
      if ($(e.target).is('.left-content') || $(e.target).is('a')) {
        closeMenu();
      }
      
    }
  });

});
</script>

</body>

</html>
