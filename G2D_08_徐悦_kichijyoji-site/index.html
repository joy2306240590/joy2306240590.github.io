<script src="https://code.jquery.com/jquery-latest.min.js"></script>
<script>
jQuery(function($){
  const $btn   = $('.menu-hamburger');      
  const $menu  = $('.left-content');

  function openMenu(){
    $menu.addClass('open'); 
    $btn.addClass('active'); // 汉堡变X
  }

  function closeMenu(){
    $menu.removeClass('open'); 
    $btn.removeClass('active'); // X变回汉堡
  }

  // 1. 点击汉堡按钮：切换菜单状态
  $btn.on('click', function(){
    if ($menu.hasClass('open')) {
      closeMenu();
    } else {
      openMenu();
    }
  });

  // 2. 核心精简逻辑：点击菜单区域收回
  $menu.on('click', function(e){
    // 只在屏幕宽度小于 1024px（手机/平板）时生效
    if (window.innerWidth < 1024) {
      
      // $(e.target) 是你手指实际点到的元素
      // .is('.left-content') 判断是不是点到了最底下的空白背景
      // .is('a') 判断是不是点到了菜单里的链接
      if ($(e.target).is('.left-content') || $(e.target).is('a')) {
        closeMenu();
      }
      
    }
  });

});
</script>
